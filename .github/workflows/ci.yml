name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check Python syntax
        run: PYTHONPYCACHEPREFIX=/tmp/codex-pyc python -m py_compile scripts/*.py

      - name: Lint example configs
        run: |
          for f in templates/dcm2bids_config.json examples/*/dcm2bids_config.json; do
            python scripts/lint_config.py "$f"
          done

      - name: Run tests
        run: python -m unittest discover -s tests
